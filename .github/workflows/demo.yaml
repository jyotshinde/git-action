name: Demo Workflow
on: 
  push:
    branches: [ main ]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: output message
        run: echo "${{ toJson(github) }}"
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: install dependencies
        run: npm ci
      - name: npm run build
        run: npm run build
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: npm test
        run: npm test
      - name: npm run dev 
        run: npm run dev
  
  